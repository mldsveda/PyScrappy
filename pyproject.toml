[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pyscrappy"
version = "1.0.1"
description = "A robust, all-in-one Python web scraping toolkit"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [
    { name = "Vedant Tibrewal", email = "mlds93363@gmail.com" },
    { name = "Vedaant Singh" },
]
keywords = [
    "scraping", "web-scraping", "crawler", "data-extraction",
    "beautifulsoup", "httpx", "playwright",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.24",
    "beautifulsoup4>=4.12",
    "lxml>=4.9",
]

[project.optional-dependencies]
browser = ["playwright>=1.40"]
dataframe = ["pandas>=1.5"]
all = ["playwright>=1.40", "pandas>=1.5"]

[project.urls]
Homepage = "https://github.com/mldsveda/PyScrappy"
Repository = "https://github.com/mldsveda/PyScrappy"
Issues = "https://github.com/mldsveda/PyScrappy/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/pyscrappy"]

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.9"
strict = true
